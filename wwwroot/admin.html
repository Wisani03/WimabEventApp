<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Manage Gifts</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto space-y-8">
       
        <div class="bg-white p-6 rounded-xl shadow-md">
            <h1 class="text-2xl font-bold mb-6">Add New Gift</h1>
            <div class="space-y-4">
                <input id="name" type="text" placeholder="Gift Name" class="w-full p-2 border rounded">
                <input id="desc" type="text" placeholder="Description" class="w-full p-2 border rounded">
                <input id="price" type="number" placeholder="Price" class="w-full p-2 border rounded">
                <button onclick="addGift()" class="w-full bg-green-600 text-white py-2 rounded hover:bg-green-700">Add Gift</button>
            </div>
        </div>

       
        <div class="bg-white p-6 rounded-xl shadow-md">
            <h2 class="text-xl font-bold mb-4">Current Gifts</h2>
            <div id="admin-gift-list" class="space-y-2">
               
            </div>
        </div>
    </div>

    <script>

        
    const password = prompt("Enter Admin Password:");
if (password !== "Wimab2026") { 
    alert("Unauthorized Access!");
    window.location.href = "/";
}
        // Fetch and display gifts
        function loadAdminGifts() {
            fetch('/api/gifts')
                .then(r => r.json())
                .then(data => {
                    const list = document.getElementById('admin-gift-list');
                    list.innerHTML = data.map(g => `
                        <div class="flex justify-between items-center p-3 border rounded">
                            <div>
                                <span class="font-semibold">${g.name}</span>
                                <span class="text-gray-500 ml-2">R${g.price}</span>
                            </div>
                            <button onclick="deleteGift(${g.id})" class="text-red-600 hover:text-red-800 font-bold">Delete</button>
                        </div>
                    `).join('');
                });
        }

        // Add a gift
        function addGift() {
            const gift = {
                name: document.getElementById('name').value,
                description: document.getElementById('desc').value,
                price: parseFloat(document.getElementById('price').value)
            };

            fetch('/api/gifts/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(gift)
            }).then(() => {
                alert('Gift added!');
                document.getElementById('name').value = ''; 
                document.getElementById('desc').value = '';
                document.getElementById('price').value = '';
                loadAdminGifts(); 
            });
        }

        // Delete a gift
        function deleteGift(id) {
            if(confirm('Are you sure you want to delete this gift?')) {
                fetch(`/api/gifts/delete/${id}`, { method: 'DELETE' })
                    .then(() => loadAdminGifts());
            }
        }

        
        loadAdminGifts();
    </script>
</body>
</html>
