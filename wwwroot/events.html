<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Events | Wimab Events</title>

    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root{
            --navy:#0b1f3a;
            --navy-light:#132d50;
            --gold:#c9a227;
            --gold-light:#e5c65a;
            --white:#ffffff;
            --text:#1f2937;
            --muted:#6b7280;
            --border:#e5e7eb;
            --bg:#f6f8fb;
            --shadow:0 10px 30px rgba(11,31,58,0.08);
            --radius:18px;
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, Helvetica, sans-serif;
            background:var(--bg);
            color:var(--text);
        }

        .navbar{
            height:72px;
            background:var(--navy);
            display:flex;
            align-items:center;
            justify-content:space-between;
            padding:0 5%;
        }

        .brand{
            color:white;
            text-decoration:none;
            display:flex;
            align-items:center;
            gap:10px;
            font-size:22px;
            font-weight:700;
        }

        .brand i{
            color:var(--gold);
        }

        .nav-actions{
            display:flex;
            gap:12px;
        }

        .btn{
            text-decoration:none;
            display:inline-flex;
            align-items:center;
            gap:8px;
            padding:12px 18px;
            border-radius:10px;
            font-weight:600;
        }

        .btn-primary{
            background:var(--gold);
            color:var(--navy);
        }

        .btn-secondary{
            border:1px solid rgba(255,255,255,0.2);
            color:white;
        }

        .container{
            width:min(1200px,92%);
            margin:auto;
            padding:40px 0;
        }

        .header{
            margin-bottom:30px;
        }

        .header h1{
            color:var(--navy);
            font-size:36px;
            margin-bottom:8px;
        }

        .header p{
            color:var(--muted);
        }

        .event-grid{
            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:24px;
        }

        .event-card{
            background:white;
            border-radius:var(--radius);
            border:1px solid var(--border);
            overflow:hidden;
            box-shadow:var(--shadow);
            transition:0.25s;
        }

        .event-card:hover{
            transform:translateY(-5px);
        }

        .event-top{
            background:var(--navy);
            color:white;
            padding:25px;
        }

        .category{
            display:inline-block;
            background:rgba(201,162,39,0.15);
            color:var(--gold-light);
            padding:6px 12px;
            border-radius:30px;
            font-size:12px;
            margin-bottom:12px;
        }

        .event-title{
            font-size:24px;
            margin-bottom:10px;
        }

        .event-description{
            color:#d7e1ed;
            line-height:1.6;
            font-size:14px;
        }

        .event-body{
            padding:22px;
        }

        .info{
            display:flex;
            align-items:center;
            gap:10px;
            margin-bottom:15px;
            color:var(--muted);
            font-size:14px;
        }

        .info i{
            color:var(--gold);
            width:18px;
        }

        .buttons{
            display:flex;
            gap:10px;
            margin-top:20px;
        }

        .view-btn{
            flex:1;
            background:var(--navy);
            color:white;
            text-decoration:none;
            padding:12px;
            border-radius:10px;
            text-align:center;
            font-weight:600;
        }

        .delete-btn{
            background:#fef2f2;
            color:#b91c1c;
            border:none;
            padding:12px 15px;
            border-radius:10px;
            cursor:pointer;
        }

        .empty{
            background:white;
            padding:60px;
            border-radius:var(--radius);
            text-align:center;
            border:1px dashed #d1d5db;
        }

        .empty h2{
            color:var(--navy);
            margin:15px 0;
        }

        .loading{
            text-align:center;
            padding:60px;
            color:var(--muted);
        }

        @media(max-width:900px){
            .event-grid{
                grid-template-columns:repeat(2,1fr);
            }
        }

        @media(max-width:650px){

            .navbar{
                flex-direction:column;
                height:auto;
                padding:15px;
                gap:15px;
            }

            .nav-actions{
                width:100%;
            }

            .btn{
                flex:1;
                justify-content:center;
            }

            .event-grid{
                grid-template-columns:1fr;
            }

            .buttons{
                flex-direction:column;
            }
        }
    </style>
</head>
<body>

<nav class="navbar">

    <a href="./dashboard.html" class="brand">
        <i data-lucide="calendar-heart"></i>
        Wimab Events
    </a>

    <div class="nav-actions">

        <a href="./dashboard.html" class="btn btn-secondary">
            <i data-lucide="layout-dashboard"></i>
            Dashboard
        </a>

        <a href="./create-event.html" class="btn btn-primary">
            <i data-lucide="plus"></i>
            Create Event
        </a>

    </div>

</nav>

<div class="container">

    <div class="header">
        <h1>My Events</h1>
        <p>Manage and view all your events.</p>
    </div>

    <div id="loading" class="loading">
        Loading events...
    </div>

    <div id="eventList" class="event-grid"></div>

</div>

<script>

const API_URL = "/api/events";

async function loadEvents(){

    const container = document.getElementById("eventList");
    const loading = document.getElementById("loading");

    try{

        const response = await fetch(API_URL);

        const events = await response.json();

        loading.style.display = "none";

        if(events.length === 0){

            container.innerHTML = `
                <div class="empty">
                    <i data-lucide="calendar-x" size="50"></i>
                    <h2>No Events Yet</h2>
                    <p>Create your first event.</p>
                </div>
            `;

            lucide.createIcons();
            return;
        }

        container.innerHTML = events.map(event => `

            <div class="event-card">

                <div class="event-top">

                    <div class="category">
                        ${event.category || "General"}
                    </div>

                    <div class="event-title">
                        ${event.title}
                    </div>

                    <div class="event-description">
                        ${event.description || "No description"}
                    </div>

                </div>

                <div class="event-body">

                    <div class="info">
                        <i data-lucide="calendar"></i>
                        ${new Date(event.eventDate).toLocaleDateString()}
                    </div>

                    <div class="info">
                        <i data-lucide="map-pin"></i>
                        ${event.venueLocation || "No venue"}
                    </div>

                    <div class="info">
                        <i data-lucide="gift"></i>
                        ${event.wishlistItems.length} wishlist items
                    </div>

                    <div class="buttons">

                        <a class="view-btn"
                           href="./event.html?id=${event.id}">
                           View Event
                        </a>

                        <button
                            class="delete-btn"
                            onclick="deleteEvent(${event.id})">
                            Delete
                        </button>

                    </div>

                </div>

            </div>

        `).join("");

        lucide.createIcons();

    }
    catch(error){

        loading.innerHTML = "Could not load events.";

        console.error(error);
    }
}

async function deleteEvent(id){

    if(!confirm("Delete this event?")){
        return;
    }

    try{

        await fetch(`/api/events/${id}`,{
            method:"DELETE"
        });

        loadEvents();

    }
    catch(error){
        alert("Could not delete event.");
    }
}

loadEvents();

lucide.createIcons();

</script>

</body>
</html>
