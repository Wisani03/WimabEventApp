<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wimab Event Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 min-h-screen p-4 flex flex-col items-center">

    
    <div class="max-w-md w-full text-center mb-8 mt-4 text-white">
        <h1 class="text-4xl font-bold mb-2">Mabunda Gathering</h1>
        <p class="text-slate-400">Join us for a special occasion.</p>
        <div id="countdown" class="mt-4 text-xl font-mono text-blue-400">Loading countdown...</div>
    </div>

    
    <div class="max-w-md w-full bg-white/10 backdrop-blur-lg border border-white/20 p-8 rounded-2xl shadow-2xl text-white">
        <h2 class="text-xl mb-6 flex items-center gap-2"><i data-lucide="check-square"></i> RSVP Form</h2>
        
        <form id="rsvpForm" class="space-y-4">
            <div class="relative">
                <i data-lucide="user" class="absolute left-3 top-3.5 w-5 h-5 text-slate-400"></i>
                <input id="name" type="text" placeholder="First Name" required class="w-full bg-white/5 border border-white/10 p-3 pl-10 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="relative">
                <i data-lucide="user-plus" class="absolute left-3 top-3.5 w-5 h-5 text-slate-400"></i>
                <input id="surname" type="text" placeholder="Surname" required class="w-full bg-white/5 border border-white/10 p-3 pl-10 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="relative">
                <i data-lucide="phone" class="absolute left-3 top-3.5 w-5 h-5 text-slate-400"></i>
                <input id="phone" type="tel" placeholder="Phone Number" required class="w-full bg-white/5 border border-white/10 p-3 pl-10 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="relative">
                <i data-lucide="utensils" class="absolute left-3 top-3.5 w-5 h-5 text-slate-400"></i>
                <textarea id="dietary" placeholder="Dietary Requirements" class="w-full bg-white/5 border border-white/10 p-3 pl-10 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
            </div>
            
            <div class="space-y-2">
                <div class="flex items-center space-x-3">
                    <input id="attending" type="checkbox" class="w-5 h-5 accent-blue-600">
                    <label for="attending">I will be attending</label>
                </div>
                <div class="flex items-center space-x-3">
                    <input id="plusOneToggle" type="checkbox" class="w-5 h-5 accent-blue-600">
                    <label for="plusOneToggle">Bringing a plus one?</label>
                </div>
            </div>

            <input id="plusOneName" type="text" placeholder="Plus One Name" class="hidden w-full bg-white/5 border border-white/10 p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-lg font-bold transition flex items-center justify-center gap-2">
                <i data-lucide="send"></i> Confirm RSVP
            </button>
        </form>
    </div>

    
    <div class="max-w-md w-full mt-8 grid grid-cols-2 gap-4">
        
<a href="https://www.google.com/maps?q=-23.936119,31.033638" target="_blank" class="flex flex-col items-center bg-white/5 p-4 rounded-xl border border-white/10 text-white hover:bg-white/10 transition">
    <i data-lucide="map-pin" class="mb-2"></i> <span class="text-xs">Location</span>
</a>
        <a href="https://wa.me/27710704868" target="_blank" class="flex flex-col items-center bg-green-600/20 p-4 rounded-xl border border-green-500/20 text-green-100 hover:bg-green-600/30 transition">
            <i data-lucide="message-circle" class="mb-2 text-green-400"></i> <span class="text-xs">WhatsApp</span>
        </a>
    </div>

    <script>

        document.getElementById("year").textContent = new Date().getFullYear();
        lucide.createIcons();

        
        const eventDate = new Date("2026-12-25T10:00:00").getTime();
        setInterval(() => {
            const now = new Date().getTime();
            const diff = eventDate - now;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            document.getElementById("countdown").innerHTML = `${days}d ${hours}h until the gathering!`;
        }, 1000);

        
        const toggle = document.getElementById('plusOneToggle');
        const plusOneInput = document.getElementById('plusOneName');
        toggle.addEventListener('change', () => plusOneInput.classList.toggle('hidden', !toggle.checked));

        document.getElementById('rsvpForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const guest = {
                name: document.getElementById('name').value,
                surname: document.getElementById('surname').value,
                phoneNumber: document.getElementById('phone').value,
                isAttending: document.getElementById('attending').checked,
                dietaryRequirements: document.getElementById('dietary').value,
                plusOneName: toggle.checked ? document.getElementById('plusOneName').value : null
            };
            const response = await fetch('/api/rsvp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(guest)
            });
            if (response.ok) {
                alert("Thank you! Your RSVP has been recorded.");
                document.getElementById('rsvpForm').reset();
                plusOneInput.classList.add('hidden');
            } else {
                alert("Error sending RSVP.");
            }
        });
    </script>

    <footer class="mt-8 mb-4 text-center text-slate-500 text-sm">
    <p>&copy; <span id="year"></span> Developed by Wisani Mabunda</p>
    </footer>
</body>
</html>
