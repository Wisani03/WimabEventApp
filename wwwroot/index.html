<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wimab Event RSVP</title>
</head>
<body>
    <h2>RSVP for the Event</h2>
    <form id="rsvpForm">
        <input type="text" id="name" placeholder="Name" required><br>
        <input type="text" id="surname" placeholder="Surname" required><br>
        <input type="tel" id="phone" placeholder="Phone Number" required><br>
        <label>
            <input type="checkbox" id="attending"> I will attend
        </label><br>
        <textarea id="dietary" placeholder="Dietary Requirements"></textarea><br>
        <button type="submit">Submit RSVP</button>
    </form>

    <script>
        document.getElementById('rsvpForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const guest = {
                name: document.getElementById('name').value,
                surname: document.getElementById('surname').value,
                phoneNumber: document.getElementById('phone').value,
                isAttending: document.getElementById('attending').checked,
                dietaryRequirements: document.getElementById('dietary').value
            };

            const response = await fetch('/api/rsvp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(guest)
            });

            if (response.ok) alert("RSVP Sent!");
            else alert("Error sending RSVP.");
        });
    </script>
</body>
</html>
